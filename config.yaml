wake_word:
  phrase: "hey oli"          # trigger phrase (openWakeWord model must match)
  threshold: 0.5             # detection confidence threshold (0.0–1.0)

persona:
  name: "Oli"
  system_prompt: |
    You are Oli, a friendly and engaging humanoid robot built by Limix Dynamics and
    showcased by Looking Glass XR. You are meeting members of the public at a
    demonstration event. Be warm, curious, and approachable. Keep responses concise —
    two to four sentences unless asked for more detail. You can talk about robotics,
    technology, and what you are capable of. If asked something outside your knowledge,
    say so honestly and redirect to something you can help with.
  topic_scope: ""            # optional: restrict topics (leave empty for open conversation)

stt:
  model: "large-v3"          # faster-whisper model size
  language: "en"             # transcription language
  device: "cuda"             # "cuda" for GPU, "cpu" for fallback
  compute_type: "float16"    # float16 for GPU, int8 for CPU

llm:
  base_url: "http://localhost:11434"
  model: "llama3.1:8b"
  temperature: 0.7
  max_tokens: 256            # keep responses concise for voice delivery

tts:
  voice: "en_US-lessac-medium"   # piper voice model name
  speed: 1.0                     # speech rate multiplier
  output_device: null            # null = system default speaker

audio:
  sample_rate: 16000         # Hz — standard for speech models
  channels: 1                # mono
  chunk_ms: 80               # ms per audio chunk for wake word processing
  silence_threshold_ms: 1200 # ms of silence to mark end of utterance
  max_record_s: 30           # max recording length before auto-cutoff
